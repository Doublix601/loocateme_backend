# Config nginx custom, remplace le nginx.conf par défaut de l'image nginx:alpine
# (worker_processes 1, pas de zone de rate limiting) qui n'exploite qu'un seul
# cœur et laisse passer tout le trafic tel quel jusqu'à Node.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Rate limiting en amont de Node : rejette les rafales excessives avant
    # qu'elles ne consomment un worker PM2 / une connexion Mongo. 20 req/s par IP
    # avec une rafale absorbée de 40 (burst) laisse de la marge à un usage normal
    # (l'app mobile peut faire plusieurs appels rapprochés) tout en coupant un pic
    # viral avant qu'il n'atteigne l'API.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;

    include /etc/nginx/conf.d/*.conf;
}
